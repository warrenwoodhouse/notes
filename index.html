  <!-- ================= JAVASCRIPT & ENCRYPTION ENGINE ================= -->
  <script>
    // Global Application State
    let masterPasscode = null;
    let decryptedNotes = [];
    let currentCategoryFilter = 'all';
    let deferredPwaPrompt = null;
    let isPreviewing = false;

    // --- Dynamic PWA Manifest & Service Worker Registration ---
    (function initPWA() {
      // Inline Manifest creation
      const manifestObj = {
        name: "Warren Notes - Warren Woodhouse",
        short_name: "WarrenNotes",
        start_url: ".",
        display: "standalone",
        background_color: "#f39f22",
        theme_color: "#f39f22",
        icons: [{
          src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M30 45V35a20 20 0 0 1 40 0v10h5v40H25V45h5zm10 0h20V35a10 10 0 0 0-20 0v10z' fill='white'/></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
      document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

      // Inline Service Worker registration for offline support
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = 'warren-notes-v1';
          self.addEventListener('install', e => {
            e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
          });
          self.addEventListener('fetch', e => {
            e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
          });
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW setup skipped:', err));
      }
    })();

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPwaPrompt = e;
      document.getElementById('pwa-install-btn').classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPwaPrompt) {
        deferredPwaPrompt.prompt();
        deferredPwaPrompt.userChoice.then(() => {
          deferredPwaPrompt = null;
          document.getElementById('pwa-install-btn').classList.add('hidden');
        });
      }
    }

    // --- WebCrypto Encryption Engine (AES-256-GCM + PBKDF2) ---
    async function getKey(passcode, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passcode), 'PBKDF2', false, ['deriveKey']);
      return await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function encryptText(text, passcode) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getKey(passcode, salt);
      const enc = new TextEncoder();
      const cipherBuffer = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(text));
      
      return {
        cipherText: bufToHex(cipherBuffer),
        iv: bufToHex(iv),
        salt: bufToHex(salt)
      };
    }

    async function decryptText(encryptedObj, passcode) {
      try {
        const salt = hexToBuf(encryptedObj.salt);
        const iv = hexToBuf(encryptedObj.iv);
        const cipherText = hexToBuf(encryptedObj.cipherText);
        const key = await getKey(passcode, salt);
        const decryptedBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipherText);
        return new TextDecoder().decode(decryptedBuffer);
      } catch (err) {
        throw new Error("Decryption failed. Invalid passcode.");
      }
    }

    function bufToHex(buf) {
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function hexToBuf(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) bytes[i / 2] = parseInt(hex.substring(i, i + 2), 16);
      return bytes.buffer;
    }

    // --- Auth & Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
      const pinMeta = localStorage.getItem('vault_pin_meta');
      if (!pinMeta) {
        document.getElementById('auth-title').innerText = "Create Master Passcode";
        document.getElementById('auth-subtitle').innerText = "Set a passcode to secure & encrypt all your notes.";
        document.getElementById('auth-btn').innerText = "Create Vault";
      }
    });

    async function handleAuth(e) {
      e.preventDefault();
      const inputPass = document.getElementById('passcode-input').value;
      const errorEl = document.getElementById('auth-error');
      errorEl.classList.add('hidden');

      const pinMeta = localStorage.getItem('vault_pin_meta');

      if (!pinMeta) {
        // First Time Setup: Create Verification Token
        const testPayload = await encryptText("VAULT_VERIFIED", inputPass);
        localStorage.setItem('vault_pin_meta', JSON.stringify(testPayload));
        masterPasscode = inputPass;
        unlockSuccess();
      } else {
        // Verify Passcode
        try {
          const testObj = JSON.parse(pinMeta);
          const decryptedCheck = await decryptText(testObj, inputPass);
          if (decryptedCheck === "VAULT_VERIFIED") {
            masterPasscode = inputPass;
            unlockSuccess();
          } else {
            throw new Error();
          }
        } catch (err) {
          errorEl.innerText = "Incorrect passcode. Please try again.";
          errorEl.classList.remove('hidden');
        }
      }
    }

    async function unlockSuccess() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('passcode-input').value = '';
      await loadAndDecryptNotes();
    }

    function lockVault() {
      masterPasscode = null;
      decryptedNotes = [];
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('auth-error').classList.add('hidden');
    }

    // --- Note CRUD Logic ---
    async function loadAndDecryptNotes() {
      const rawEncryptedNotes = JSON.parse(localStorage.getItem('vault_notes') || '[]');
      decryptedNotes = [];

      for (let encNote of rawEncryptedNotes) {
        try {
          const decryptedBody = await decryptText(encNote.encryptedContent, masterPasscode);
          decryptedNotes.push({
            id: encNote.id,
            title: encNote.title,
            category: encNote.category,
            body: decryptedBody,
            updatedAt: encNote.updatedAt
          });
        } catch (err) {
          console.error("Failed to decrypt note:", encNote.id);
        }
      }
      renderNotes();
    }

    async function saveNote(e) {
      e.preventDefault();
      const id = document.getElementById('note-id').value || Date.now().toString();
      const title = document.getElementById('note-title-input').value;
      const category = document.getElementById('note-category-input').value;
      const body = document.getElementById('note-body-input').value;

      // Encrypt sensitive content payload
      const encryptedContent = await encryptText(body, masterPasscode);

      const rawEncryptedNotes = JSON.parse(localStorage.getItem('vault_notes') || '[]');
      const existingIdx = rawEncryptedNotes.findIndex(n => n.id === id);

      const notePayload = {
        id,
        title,
        category,
        encryptedContent,
        updatedAt: new Date().toISOString()
      };

      if (existingIdx >= 0) {
        rawEncryptedNotes[existingIdx] = notePayload;
      } else {
        rawEncryptedNotes.unshift(notePayload);
      }

      localStorage.setItem('vault_notes', JSON.stringify(rawEncryptedNotes));
      closeNoteModal();
      await loadAndDecryptNotes();
    }

    async function deleteNote(id, event) {
      event.stopPropagation();
      if (confirm("Are you sure you want to permanently delete this note?")) {
        let rawEncryptedNotes = JSON.parse(localStorage.getItem('vault_notes') || '[]');
        rawEncryptedNotes = rawEncryptedNotes.filter(n => n.id !== id);
        localStorage.setItem('vault_notes', JSON.stringify(rawEncryptedNotes));
        await loadAndDecryptNotes();
      }
    }

    // --- UI Rendering & Filtering ---
    function renderNotes() {
      const grid = document.getElementById('notes-grid');
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = decryptedNotes.filter(n => {
        const matchesCategory = currentCategoryFilter === 'all' || n.category === currentCategoryFilter;
        const matchesSearch = n.title.toLowerCase().includes(searchVal) || n.body.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      // Update Counts
      updateCategoryCounts();

      if (filtered.length === 0) {
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }
      document.getElementById('empty-state').classList.add('hidden');

      filtered.forEach(note => {
        const dateStr = new Date(note.updatedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const card = document.createElement('div');
        card.className = "bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 rounded-xl p-4 flex flex-col justify-between cursor-pointer transition shadow-sm group";
        card.onclick = () => openNoteModal(note);

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-2 mb-2">
              <h3 class="font-semibold text-slate-100 group-hover:text-indigo-400 transition truncate">${escapeHTML(note.title)}</h3>
              <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 bg-slate-900 border border-slate-700 rounded text-slate-400">${note.category}</span>
            </div>
            <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed mb-4">${escapeHTML(note.body)}</p>
          </div>
          <div class="flex items-center justify-between text-xs text-slate-500 pt-2 border-t border-slate-700/40">
            <span><i class="fa-regular fa-clock mr-1"></i>${dateStr}</span>
            <button onclick="deleteNote('${note.id}', event)" title="Delete" class="hover:text-rose-400 p-1 transition">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateCategoryCounts() {
      const categories = ['all', 'personal', 'work', 'financial', 'ideas'];
      categories.forEach(cat => {
        const count = cat === 'all' 
          ? decryptedNotes.length 
          : decryptedNotes.filter(n => n.category === cat).length;
        const el = document.getElementById(`count-${cat}`);
        if (el) el.innerText = count;
      });
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600/20', 'text-indigo-300', 'font-medium');
        btn.classList.add('text-slate-300');
      });
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-indigo-600/20', 'text-indigo-300', 'font-medium');
      }
      renderNotes();
    }

    // --- Modal Controls & Markdown ---
    function openNoteModal(note = null) {
      document.getElementById('note-id').value = note ? note.id : '';
      document.getElementById('note-title-input').value = note ? note.title : '';
      document.getElementById('note-category-input').value = note ? note.category : 'personal';
      document.getElementById('note-body-input').value = note ? note.body : '';
      document.getElementById('modal-title').innerText = note ? 'Edit Note' : 'Create New Note';
      
      if (isPreviewing) toggleMarkdownPreview();
      document.getElementById('note-modal').classList.remove('hidden');
    }

    function closeNoteModal() {
      document.getElementById('note-modal').classList.add('hidden');
    }

    function toggleMarkdownPreview() {
      const textarea = document.getElementById('note-body-input');
      const preview = document.getElementById('markdown-preview');
      const btn = document.getElementById('preview-toggle');

      isPreviewing = !isPreviewing;
      if (isPreviewing) {
        preview.innerHTML = marked.parse(textarea.value || '*No content*');
        textarea.classList.add('hidden');
        preview.classList.remove('hidden');
        btn.innerHTML = `<i class="fa-solid fa-pen mr-1"></i> Edit`;
      } else {
        textarea.classList.remove('hidden');
        preview.classList.add('hidden');
        btn.innerHTML = `<i class="fa-solid fa-eye mr-1"></i> Preview`;
      }
    }

    // --- Backup & Import Logic ---
    function exportBackup() {
      const rawNotes = localStorage.getItem('vault_notes') || '[]';
      const pinMeta = localStorage.getItem('vault_pin_meta') || '';
      const backupObj = {
        version: 1,
        pinMeta: JSON.parse(pinMeta),
        notes: JSON.parse(rawNotes)
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `vault_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackup(e) {
      const fileReader = new FileReader();
      fileReader.onload = async function (event) {
        try {
          const backupObj = JSON.parse(event.target.result);
          if (backupObj.notes) {
            localStorage.setItem('vault_notes', JSON.stringify(backupObj.notes));
            await loadAndDecryptNotes();
            alert("Backup imported successfully!");
          }
        } catch (err) {
          alert("Invalid backup file.");
        }
      };
      fileReader.readAsText(e.target.files[0]);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
